<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="NdaY': Bridging Innovation and Community for sustainable future">
    <title>NdaY' - Bridging Innovation and Community for sustainable future</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Lulu&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Lulu', sans-serif;
        }
    </style>
</head>
<!-- Top Section -->
<body>
    <!-- Header Section -->
<header class="sticky-header">
    <!-- Background Image (Dimmed Logo) -->
    <div class="header-background"></div>

    <!-- Content Container -->
    <div class="header-content">
        <!-- Welcome Text (Left) -->
        <div class="welcome-text">
            <h1>Welcome to </h1>
        </div>

        <!-- Logo (Center) -->
        <div class="logo-container">
            <img src="assets/images/NdaY_Logo.png" alt="NdaY Logo" class="logo-image">
        </div>

        <!-- Tagline (Right) -->
        <div class="tagline">
            <p>Bridging Innovation and Community for a sustainable future</p>
        </div>
    </div>
</header>

<!-- Horizontal Menu (Outside the Header) -->
<nav id="horizontal-menu" class="horizontal-menu">
    <!-- Menu items will be dynamically generated here -->
</nav>
    
    
        <!-- Dynamic Background Section -->
        <section class="hero-dynamic">
            <div class="dynamic-background">
                <!-- Fixed Background Image -->
                <div class="rotating-globe">
                    <img src="assets/images/NdaY_Globe.png" alt="Rotating Globe" class="globe-image">
                </div>
                <div class="dropping-smartphone">
                    <img src="assets/images/NdaY_smartphone.png" alt="Smartphone" class="smartphone-image">
                </div>
            </div>
        </section>
    
        <!-- Footer -->
        <footer>
            <div class="container">
                <p>&copy; 2025 NdaY'. All rights reserved.</p>
            </div>
        </footer>
    
        <!-- JavaScript -->
        <script src="script.js"></script>
    </body>

    <!-- JavaScript -->
    <script src="script.js"></script>
</html>
